# Omgeving voor de app: pixi installeert R en alle packages zelf.
# Starten: dubbelklik op "Start app" of run `pixi run app`.

[workspace]
name = "waar-wonen-ze"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
r-base = "4.5.*"
r-shiny = "*"
r-sf = "*"
r-ggplot2 = ">=3.5"
r-dplyr = "*"
r-readxl = "*"
r-yaml = "*"
r-gt = "*"
r-rcolorbrewer = "*"
r-purrr = "*"
r-here = "*"
# Tabel als PNG; gebruikt een geïnstalleerde Chrome/Edge
r-webshot2 = "*"

[tasks]
app = "Rscript -e \"shiny::runApp('.', launch.browser = TRUE)\""
kaart = "Rscript main.R"

# Ontwikkelen: tests en scripts voor data
[feature.dev.dependencies]
r-testthat = "*"
r-writexl = "*"

[feature.dev.tasks]
test = "Rscript tests/testthat.R"
prepare-data = "Rscript scripts/prepare_data.R"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
