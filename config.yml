# =============================================================================
# Choropleth Kaarten - Configuratie
# =============================================================================

default:
  # ---------------------------------------------------------------------------
  # Instelling
  # ---------------------------------------------------------------------------
  titel: "ROC Mondriaan studenten"
  # peildatum: "1 okt 2026"   # standaard uit de kolom Peildatum van de data

  # ---------------------------------------------------------------------------
  # Jaargang van de CBS-kaart
  # Standaard het jaar van de peildatum in de data, anders de nieuwste.
  # Vastzetten kan met bijv. jaar: 2025
  # ---------------------------------------------------------------------------
  jaar: null

  # ---------------------------------------------------------------------------
  # Data bestanden
  # Referentiedata per jaargang (gemeenten_<jaar>.rds etc.) wordt meegeleverd;
  # een nieuwe jaargang ophalen kan in de app of met scripts/prepare_data.R
  # ---------------------------------------------------------------------------
  data:
    studenten: "data/01_raw/studenten.xlsx"   # alleen voor main.R
    demo: "data/voorbeeld/studenten_demo.xlsx"
    referentie: "data/reference"
    locaties: "data/locaties_roc_mondriaan.csv"

  # ---------------------------------------------------------------------------
  # Filters op studentkenmerken: kolom -> toegestane waarden
  # Kolommen die niet in de data staan worden overgeslagen.
  # ---------------------------------------------------------------------------
  filters:
    IsBekostigd: [true]

  # ---------------------------------------------------------------------------
  # Visualisatie
  # ---------------------------------------------------------------------------
  visualisatie:
    kleuren_palet: "Blues"
    nul_kleur: "#f0f0f0"
    toon_labels: false
    border_kleur: "black"
    border_dikte: 0.2

  # ---------------------------------------------------------------------------
  # Klassegrenzen
  # breaks_preset: "auto", "veel" (1-200 ... 8001-10000),
  #                "middel" (1-20 ... 1001-2000), "weinig" (1-5 ... 81-100)
  #                of "eigen" met breaks: [1, 20, 150, ...]
  # ---------------------------------------------------------------------------
  breaks_preset: "auto"

  # ---------------------------------------------------------------------------
  # Tabel
  # ---------------------------------------------------------------------------
  tabel:
    min_aantal: 10

  # ---------------------------------------------------------------------------
  # Schoollocaties (uit data$locaties) tonen op de kaart
  # ---------------------------------------------------------------------------
  toon_locaties: false

# =============================================================================
# Gebied definities
# =============================================================================

den_haag:
  inherits: default
  gebied:
    naam: "Den Haag"
    type: "gemeente"
    filter:
      gm_codes: ["GM0518"]
  niveau: "wijk"
  visualisatie:
    kleuren_palet: "Reds"
    toon_labels: true
  toon_locaties: true

haaglanden:
  inherits: default
  titel: "Bekostigde ROC Mondriaan studenten, gemeenten Haaglanden"
  gebied:
    naam: "Haaglanden"
    type: "custom"
    filter:
      gm_codes:
        - "GM0503"  # Delft
        - "GM0518"  # 's-Gravenhage
        - "GM0603"  # Rijswijk (ZH.)
        - "GM0629"  # Wassenaar
        - "GM0637"  # Zoetermeer
        - "GM1783"  # Westland
        - "GM1842"  # Midden-Delfland
        - "GM1916"  # Leidschendam-Voorburg
        - "GM1926"  # Pijnacker-Nootdorp
  niveau: "gemeente"
  breaks_preset: "veel"
  toon_locaties: true
  visualisatie:
    kleuren_palet: "Reds"
    toon_labels: true
    border_kleur: "white"

zuid_holland:
  inherits: default
  gebied:
    naam: "Zuid-Holland"
    type: "provincie"
    filter:
      provincie: "Zuid-Holland"
  niveau: "gemeente"
  visualisatie:
    kleuren_palet: "Blues"
    toon_labels: false

nederland:
  inherits: default
  titel: "Bekostigde ROC Mondriaan studenten"
  gebied:
    naam: "Nederland"
    type: "land"
    filter: null
  niveau: "gemeente"
  breaks_preset: "eigen"
  breaks: [1, 20, 150, 500, 2000, 9000, 10000]
  visualisatie:
    kleuren_palet: "Blues"
    toon_labels: false

