# =============================================================================
# Choropleth Kaarten - Configuratie
# =============================================================================

default:
  # ---------------------------------------------------------------------------
  # Instelling
  # ---------------------------------------------------------------------------
  titel: "ROC Mondriaan studenten"
  peildatum: "1 okt 2025"
  
  # ---------------------------------------------------------------------------
  # Data bestanden
  # ---------------------------------------------------------------------------
  data:
    studenten: "data/01_raw/studenten.xlsx"
    gpkg: "data/01_raw/WijkBuurtkaart_2025_v0.gpkg"
    gemeenten_ref: "data/reference/Gemeenten alfabetisch 2023.xlsx"
    pc6_wijk_ref: "data/reference/pc6hnr20250801_gwb.csv"
  
  # ---------------------------------------------------------------------------
  # Visualisatie
  # ---------------------------------------------------------------------------
  visualisatie:
    kleuren_palet: "Blues"
    toon_labels: false
    border_kleur: "black"
    border_dikte: 0.2
  
  # ---------------------------------------------------------------------------
  # Breaks preset voor categorieën
  # Options: "veel", "middel", "weinig", "auto"
  # ---------------------------------------------------------------------------
  breaks_preset: "veel"
  
  # ---------------------------------------------------------------------------
  # Locatie markers (schoollocaties)
  # ---------------------------------------------------------------------------
  locaties: []
    # - naam: "Aspasialaan"
    #   lat: 52.0531923
    #   lon: 4.2694465
    # - naam: "Europa"
    #   lat: 51.9935904
    #   lon: 4.2263662

# =============================================================================
# Gebied definities
# =============================================================================

den_haag:
  inherits: default
  gebied:
    naam: "Den Haag"
    type: "gemeente"
    filter:
      gm_codes: ["GM0518"]
  niveau: "wijk"
  visualisatie:
    kleuren_palet: "Reds"
    toon_labels: true

haaglanden:
  inherits: default
  gebied:
    naam: "Haaglanden"
    type: "custom"
    filter:
      gm_codes: 
        - "GM0503"  # Delft
        - "GM0518"  # Den Haag
        - "GM0603"  # Rijswijk
        - "GM0629"  # Wassenaar
        - "GM0637"  # Westland
        - "GM1783"  # Westland (oud)
        - "GM1842"  # Midden-Delfland
        - "GM1916"  # Leidschendam-Voorburg
        - "GM1926"  # Pijnacker-Nootdorp
  niveau: "gemeente"
  visualisatie:
    kleuren_palet: "Reds"
    toon_labels: true

zuid_holland:
  inherits: default
  gebied:
    naam: "Zuid-Holland"
    type: "provincie"
    filter:
      provincie: "Zuid-Holland"
  niveau: "gemeente"
  visualisatie:
    kleuren_palet: "Blues"
    toon_labels: false

nederland:
  inherits: default
  gebied:
    naam: "Nederland"
    type: "land"
    filter: null
  niveau: "gemeente"
  visualisatie:
    kleuren_palet: "Blues"
    toon_labels: false

