name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Zelfde omgeving als gebruikers krijgen via "Start app" (pixi.lock)
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev

      - name: Run tests
        run: pixi run test
