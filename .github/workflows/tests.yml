name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zelfde omgeving als gebruikers krijgen via "Start app" (pixi.lock)
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev

      - name: Run tests
        run: pixi run test
